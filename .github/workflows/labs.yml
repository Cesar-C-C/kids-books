name: Validate 3D labs
on:
  pull_request:
    paths: ['labs/**', 'qa_*.cjs', 'tests/qa_ropeway_*.cjs', 'tools/ropeway_*.cjs', 'docs/ropeway-narration-lock.json', 'index.html', 'books/**/index.html', 'shared/library-sections.css', 'animations/**', 'video-production/**', 'docs/video-production/**', 'tools/release_assets.mjs', 'tools/build_pages_payload.mjs', 'tools/check_pages_gate.mjs', 'tests/release_distribution.test.mjs', '.github/workflows/pages.yml', '.github/workflows/labs.yml']
  push:
    branches: [main]
    paths: ['labs/**', 'qa_*.cjs', 'tests/qa_ropeway_*.cjs', 'tools/ropeway_*.cjs', 'docs/ropeway-narration-lock.json', 'index.html', 'books/**/index.html', 'shared/library-sections.css', 'animations/**', 'video-production/**', 'docs/video-production/**', 'tools/release_assets.mjs', 'tools/build_pages_payload.mjs', 'tools/check_pages_gate.mjs', 'tests/release_distribution.test.mjs', '.github/workflows/pages.yml', '.github/workflows/labs.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa_labs.cjs
      - run: node qa_models.cjs
      - run: node tests/qa_ropeway_model.cjs
      - run: node tests/qa_ropeway_audio.cjs
      - run: node qa_engine_model.cjs
      - run: node qa_airframe_details.cjs
      - run: node qa_discovery_progress.cjs
      - run: node qa_v3_airplane_model.cjs
      - run: node qa_v3_hsr_model.cjs
      - run: node qa_v3_rocket_model.cjs
      - run: node qa_v3_schoolbus_model.cjs
      - run: node qa_v3_doubledecker_model.cjs
      - run: node qa_v3_engine.cjs
      - run: node qa_book_hsr_model.cjs

      - run: node qa_book_airplane_model.cjs
      - run: node qa_book_space_models.cjs
      - run: node qa_exhibits_model.cjs
      - run: node qa_station_tour.cjs
      - run: node qa_station_cabin_depth.cjs
